name: security-scans

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan-and-ingest:
    runs-on: ubuntu-latest
    env:
      # `secrets` isn't available inside `if:` expressions (only in `env:`,
      # `with:`, `container:`, `services:`, and job `environment:`), so the
      # token is promoted to a job-level env var here and checked as
      # `env.SNYK_TOKEN` in the Snyk steps' `if:` conditions instead.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Check out vigilant-engine (with demo-target submodule)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node (for demo-target and npm-based tools)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Upgrade npm
        # Node 22's bundled npm (10.9.8 on the ubuntu-latest runner as of this
        # writing) hits a known Arborist null-pointer bug ("Cannot read
        # properties of null (reading 'edgesOut')") when resolving
        # demo-target/frontend's dependency tree during its postinstall step.
        # Not reproducible locally, where npm 11.x is used - upgrading here
        # closes that version gap instead of pinning to a broken one.
        run: npm install -g npm@latest

      - name: Install ingestion service dependencies
        run: pip install -r ingestion/requirements.txt

      - name: Run ingestion service tests
        working-directory: ingestion
        run: pytest --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: ingestion/pytest-report.xml

      - name: Start the ingestion API in the background
        working-directory: ingestion
        run: |
          nohup uvicorn app.main:app --port 8000 > ingestion.log 2>&1 &
          for i in $(seq 1 10); do
            curl -sf http://localhost:8000/docs > /dev/null && exit 0
            sleep 1
          done
          echo "ingestion API never came up:"; cat ingestion.log; exit 1

      - name: Install demo-target dependencies
        working-directory: demo-target
        run: npm install

      # ---------- Semgrep (SAST) ----------
      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep scan --config auto --json --output semgrep-results.json demo-target/ || true

      - name: Ingest Semgrep results
        run: python3 .github/scripts/post_to_ingestion.py --source semgrep --file semgrep-results.json

      # ---------- npm audit (SCA) ----------
      - name: Run npm audit
        working-directory: demo-target
        run: npm audit --json > ../npm-audit-results.json || true

      - name: Ingest npm audit results
        run: python3 .github/scripts/post_to_ingestion.py --source npm_audit --file npm-audit-results.json

      # ---------- Snyk (SCA) - only runs once SNYK_TOKEN is configured ----------
      - name: Run Snyk
        if: ${{ env.SNYK_TOKEN != '' }}
        working-directory: demo-target
        run: |
          npm install -g snyk
          snyk test --json > ../snyk-results.json || true

      - name: Ingest Snyk results
        if: ${{ env.SNYK_TOKEN != '' }}
        run: python3 .github/scripts/post_to_ingestion.py --source snyk --file snyk-results.json

      # ---------- gitleaks (secret scanning) ----------
      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Run gitleaks against demo-target
        run: ./gitleaks detect --source demo-target --report-format json --report-path gitleaks-results.json --no-banner || true

      - name: Ingest gitleaks results
        run: python3 .github/scripts/post_to_ingestion.py --source gitleaks --file gitleaks-results.json

      - name: Upload raw scanner output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-scanner-output
          path: |
            semgrep-results.json
            npm-audit-results.json
            snyk-results.json
            gitleaks-results.json
          if-no-files-found: ignore

      - name: Show resulting stats and write run summary
        if: always()
        run: python3 .github/scripts/write_run_summary.py
